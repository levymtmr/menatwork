name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test calculations, invoices and update policy
        run: scripts/test.sh
      - name: Test Marken persistence and daily thresholds
        run: |
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o "$RUNNER_TEMP/json.jar"
          echo "3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  $RUNNER_TEMP/json.jar" | sha256sum -c -
          JSON_TEST_JAR="$RUNNER_TEMP/json.jar" scripts/test-marken-store.sh
          JSON_TEST_JAR="$RUNNER_TEMP/json.jar" scripts/test-paired-invoices.sh
          JSON_TEST_JAR="$RUNNER_TEMP/json.jar" scripts/test-receipts.sh
      - name: Test app interface and Marken invoice
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/menatwork-browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/menatwork-ui" --no-audit --no-fund playwright@1.57.0
          node "$RUNNER_TEMP/menatwork-ui/node_modules/playwright/cli.js" install chromium --only-shell
          NODE_PATH="$RUNNER_TEMP/menatwork-ui/node_modules" node tests/ui.cjs
          NODE_PATH="$RUNNER_TEMP/menatwork-ui/node_modules" node tests/brand.cjs
          NODE_PATH="$RUNNER_TEMP/menatwork-ui/node_modules" node tests/receipt-ocr.cjs
      - name: Compile smoke build with a temporary CI key
        env:
          NEON_SIGNING_KEY: ${{ runner.temp }}/neon-shift-ci.jks
        run: scripts/build-apk.sh
      # CI has no production signing key and does not publish installable updates.
